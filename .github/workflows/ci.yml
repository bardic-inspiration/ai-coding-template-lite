# CI — the merge gate. Runs `check` (AGENTS.md "Commands") on every PR and
# every push to main. Add checks to `check`, not here, so local and CI agree.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

